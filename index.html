<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMING SOON | RORRAXY Sci-Tech Academy</title>

    <!-- Google Luxury Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #000000;
            --gold-light: #ffffff;
            --gold-mid: #ffd700;
            --gold-dark: #b8860b;
            --font-luxury: 'Cinzel', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: var(--bg-black) !important;
            font-family: var(--font-luxury);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dynamic Golden Aurora Glow in Background */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .aurora-orb {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            animation: pulseGlow 8s infinite ease-in-out alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Floating Golden Dust Canvas */
        #dustCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* Center Display Stage */
        .coming-soon-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1.2vw, 16px);
            padding: 20px;
            text-align: center;
        }

        /* Pure Metallic Gold Shimmering Typography Effect */
        .letter {
            font-size: clamp(2.2rem, 7.5vw, 6rem);
            font-weight: 900;
            letter-spacing: clamp(3px, 1vw, 10px);
            background: linear-gradient(180deg, #ffffff 0%, #fff2ac 25%, #ffd700 65%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.65));
            animation: waveGlow 2.8s ease-in-out infinite alternate;
            will-change: transform, filter;
        }

        /* Smooth Breathing Wave Animation */
        @keyframes waveGlow {
            0% {
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.5));
            }
            100% {
                transform: translateY(-10px) scale(1.05);
                filter: drop-shadow(0 0 35px rgba(255, 215, 0, 1));
            }
        }

        .word-gap {
            width: clamp(16px, 3.5vw, 45px);
        }

        /* Responsive Fix for Mobile */
        @media (max-width: 768px) {
            .letter {
                font-size: clamp(1.8rem, 8.5vw, 3.2rem);
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Soft Golden Glow Layer -->
    <div class="aurora-bg">
        <div class="aurora-orb"></div>
    </div>

    <!-- Golden Dust Particle Canvas -->
    <canvas id="dustCanvas"></canvas>

    <!-- Main "COMING SOON" Typography -->
    <div class="coming-soon-container" id="textContainer">
        <!-- Letters rendered automatically via JavaScript -->
    </div>

    <script>
        /* 1. Dynamic Letter Generator with Smooth Wave Delay */
        const text = "COMING SOON";
        const container = document.getElementById('textContainer');

        text.split('').forEach((char, index) => {
            if (char === " ") {
                const space = document.createElement('div');
                space.className = 'word-gap';
                container.appendChild(space);
            } else {
                const letter = document.createElement('span');
                letter.className = 'letter';
                letter.textContent = char;
                // Letter by letter staggered delay
                letter.style.animationDelay = `${index * 0.12}s`;
                container.appendChild(letter);
            }
        });

        /* 2. Floating Golden Particles (Dust Effect) */
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            particles = [];
            const count = Math.floor(width < 768 ? 35 : 80);

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.8 + 0.4,
                    speedY: -(Math.random() * 0.4 + 0.1),
                    speedX: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.8 + 0.2,
                    step: Math.random() * 0.01 + 0.005
                });
            }
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        function renderParticles() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.alpha += p.step;

                if (p.alpha > 0.95 || p.alpha < 0.15) {
                    p.step *= -1;
                }

                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(renderParticles);
        }

        requestAnimationFrame(renderParticles);
    </script>
</body>
</html>
