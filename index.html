<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY C-Tech Academy | Coming Soon</title>

    <!-- Luxury & Tech Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Ecosystem Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-pitch-black: #000000;
            --gold-glow: #ffd700;
            --cyan-glow: #00f3ff;
            --purple-glow: #bc13fe;
            --font-tech: 'Orbitron', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important;
            font-family: var(--font-tech);
            color: #ffffff;
            touch-action: manipulation;
        }

        #solarCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000000 !important;
            display: block;
        }

        /* Pure Floating Text Stage Without Any Box/Shape */
        .stage-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .coming-soon-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1vw, 12px);
            pointer-events: auto;
            cursor: pointer;
        }

        /* Supersonic Crisp Typography */
        .letter {
            font-size: clamp(1.6rem, 4.5vw, 3.8rem);
            font-weight: 900;
            letter-spacing: clamp(2px, 0.8vw, 8px);
            background: linear-gradient(180deg, #ffffff 0%, #ffd700 50%, #00f3ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.8));
            animation: textFloat 2.5s ease-in-out infinite alternate;
            will-change: transform, filter;
        }

        @keyframes textFloat {
            0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8)); }
            100% { transform: translateY(-5px) scale(1.03); filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.9)); }
        }

        .word-gap {
            width: clamp(12px, 2.5vw, 32px);
        }
    </style>
</head>
<body>

    <!-- Supersonic Responsive Canvas -->
    <canvas id="solarCanvas"></canvas>

    <!-- Clean Center Text Stage -->
    <div class="stage-container">
        <div class="coming-soon-wrapper" id="textContainer">
            <!-- Dynamically generated -->
        </div>
    </div>

    <script>
        /* 1. Letter Generation & Delay Stagger */
        const phrase = "COMING SOON";
        const container = document.getElementById('textContainer');

        phrase.split('').forEach((char, index) => {
            if (char === " ") {
                const space = document.createElement('div');
                space.className = 'word-gap';
                container.appendChild(space);
            } else {
                const letter = document.createElement('span');
                letter.className = 'letter';
                letter.textContent = char;
                letter.style.animationDelay = `${index * 0.12}s`;
                container.appendChild(letter);
            }
        });

        /* 2. Web Audio API - Supersonic Tech Tick Sound Generator */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // High-Tech Crisp "Tick" Sound Effect
        function playTechTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                // Fast frequency decay for crisp metallic click/tick
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        /* 3. HD Hardware-Accelerated Solar Orbit Canvas Engine */
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // High Performance Canvas Context

        let width, height, dpr;
        let centerX, centerY;
        let isMobile = false;

        // Software Ecosystem Icons List
        const softwareIcons = [
            { code: '\uf121', name: 'Dev/Code', color: '#00f3ff' },       
            { code: '\uf5d2', name: 'AI/Tech', color: '#ffd700' },        
            { code: '\uf201', name: 'Analytics', color: '#bc13fe' },      
            { code: '\uf1ec', name: 'Calculator', color: '#00ffaa' },     
            { code: '\uf008', name: 'Video Editing', color: '#ff0055' },  
            { code: '\uf72b', name: 'VFX/Graphics', color: '#00f3ff' },   
            { code: '\uf2db', name: 'Hardware/ICT', color: '#ffd700' },   
            { code: '\uf0ac', name: 'Network', color: '#bc13fe' },        
            { code: '\uf0c2', name: 'Cloud System', color: '#00ffaa' },   
            { code: '\uf5dc', name: 'Deep Learning', color: '#ff0055' }   
        ];

        let orbits = [];
        let stars = [];

        function initCanvasSize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2x DPR for maximum performance
            width = window.innerWidth;
            height = window.innerHeight;
            isMobile = width < 768;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);

            centerX = width / 2;
            centerY = height / 2;

            setupOrbits();
            setupStars();
        }

        function setupStars() {
            stars = [];
            // Optimize star count dynamically based on screen resolution
            const count = isMobile ? 35 : Math.floor((width * height) / 9000);
            for(let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.2 + 0.4,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.015 + 0.005
                });
            }
        }

        function setupOrbits() {
            orbits = [];
            const minDim = Math.min(width, height);
            
            // Adaptive Orbit Radius for Mobile/Desktop
            const radiusSteps = isMobile ? [
                minDim * 0.28,
                minDim * 0.40
            ] : [
                minDim * 0.20,
                minDim * 0.32,
                minDim * 0.42
            ];

            let iconIdx = 0;
            radiusSteps.forEach((r, orbitIdx) => {
                const countInOrbit = isMobile ? 4 : (orbitIdx === 0 ? 3 : (orbitIdx === 1 ? 3 : 4));
                const speed = (0.004 / (orbitIdx + 1)) * (orbitIdx % 2 === 0 ? 1 : -1);

                for (let i = 0; i < countInOrbit; i++) {
                    if (iconIdx < softwareIcons.length) {
                        orbits.push({
                            radius: r,
                            angle: (Math.PI * 2 / countInOrbit) * i,
                            speed: speed,
                            icon: softwareIcons[iconIdx]
                        });
                        iconIdx++;
                    }
                }
            });
        }

        window.addEventListener('resize', initCanvasSize);
        initCanvasSize();

        let lastTickTime = 0;

        function renderSolarEcosystem(timestamp) {
            // Pure Pitch Black Background Clear
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // 1. Draw Twinkling Ambient Stars
            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed *= -1;

                ctx.save();
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = star.alpha;
                ctx.fill();
                ctx.restore();
            }

            // 2. Draw Orbit Rings
            const orbitRings = [...new Set(orbits.map(o => o.radius))];
            orbitRings.forEach(r => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            });

            const activePositions = [];

            // 3. Update & Render Software Icons
            orbits.forEach(node => {
                node.angle += node.speed;
                const x = centerX + Math.cos(node.angle) * node.radius;
                const y = centerY + Math.sin(node.angle) * node.radius;

                activePositions.push({ x, y, color: node.icon.color });

                // Rays to Center
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = node.icon.color;
                ctx.globalAlpha = 0.12;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                // Icon Background Circle
                const circleRadius = isMobile ? 18 : 22;
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, circleRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.strokeStyle = node.icon.color;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = node.icon.color;
                ctx.shadowBlur = isMobile ? 6 : 12;
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // FontAwesome Icon
                ctx.save();
                const fontSize = isMobile ? 14 : 18;
                ctx.font = `900 ${fontSize}px "Font Awesome 6 Free"`;
                ctx.fillStyle = node.icon.color;
                ctx.shadowColor = node.icon.color;
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.icon.code, x, y);
                ctx.restore();
            });

            // 4. Laser Synapse Connections Between Nearby Icons
            const maxDistance = isMobile ? 130 : 180;
            for (let i = 0; i < activePositions.length; i++) {
                for (let j = i + 1; j < activePositions.length; j++) {
                    let dx = activePositions[i].x - activePositions[j].x;
                    let dy = activePositions[i].y - activePositions[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(activePositions[i].x, activePositions[i].y);
                        ctx.lineTo(activePositions[j].x, activePositions[j].y);
                        ctx.strokeStyle = activePositions[i].color;
                        ctx.globalAlpha = (1 - dist / maxDistance) * 0.3;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }

            // Periodic Tech Tick Audio Trigger
            if (timestamp - lastTickTime > 1200) {
                playTechTickSound();
                lastTickTime = timestamp;
            }

            requestAnimationFrame(renderSolarEcosystem);
        }

        // Start animation after FontAwesome icons load
        document.fonts.ready.then(() => {
            requestAnimationFrame(renderSolarEcosystem);
        });

        // Interactive Audio Listeners
        const triggerAudio = () => {
            initAudio();
            playTechTickSound();
        };

        window.addEventListener('click', triggerAudio);
        window.addEventListener('touchstart', triggerAudio);
    </script>
</body>
</html>
