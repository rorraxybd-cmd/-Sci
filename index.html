<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY C-Tech Academy | Coming Soon</title>

    <!-- Typography & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Ecosystem Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GSAP for Smooth Cinematic Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-black: #030305;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --cyan-glow: #00f3ff;
            --purple-glow: #8a2be2;
            --font-luxury: 'Cinzel', serif;
            --font-tech: 'Orbitron', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: var(--font-luxury);
            color: #ffffff;
        }

        /* Fullscreen Interactive Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Luxury Overlay Container */
        .viewport-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
        }

        /* Futuristic Ecosystem Orbit Rings */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(212, 175, 55, 0.15);
            pointer-events: none;
            animation: rotateOrbit 40s linear infinite;
        }

        .orbit-1 { width: 320px; height: 320px; border-color: rgba(0, 243, 255, 0.2); }
        .orbit-2 { width: 520px; height: 520px; animation-duration: 65s; animation-direction: reverse; }
        .orbit-3 { width: 750px; height: 750px; animation-duration: 90s; border-color: rgba(138, 43, 226, 0.2); }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Dynamic Floating Nodes with Upright Icons */
        .eco-node {
            position: absolute;
            width: 38px;
            height: 38px;
            background: rgba(5, 5, 8, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .eco-icon {
            font-size: 1.1rem;
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        /* Keep icons upright during ring rotations */
        .orbit-1 .eco-icon { animation: counterRotate1 40s linear infinite; }
        .orbit-2 .eco-icon { animation: counterRotate2 65s linear infinite; }
        .orbit-3 .eco-icon { animation: counterRotate3 90s linear infinite; }

        @keyframes counterRotate1 {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes counterRotate2 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes counterRotate3 {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Center Content Box */
        .content-core {
            position: relative;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            padding: 22px 42px;
            background: rgba(5, 5, 8, 0.55);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8),
                        inset 0 0 15px rgba(212, 175, 55, 0.08);
            transition: all 0.4s ease;
        }

        .content-core:hover {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 45px rgba(0, 243, 255, 0.25),
                        inset 0 0 20px rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }

        /* Core Text Animation - ONLY COMING SOON */
        .coming-soon-text {
            font-family: var(--font-tech);
            font-size: clamp(1.5rem, 4.5vw, 3rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            position: relative;
            display: inline-block;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .orbit-1 { width: 260px; height: 260px; }
            .orbit-2 { width: 380px; height: 380px; }
            .orbit-3 { display: none; }
            .eco-node { width: 32px; height: 32px; }
            .eco-icon { font-size: 0.9rem; }
            .content-core { padding: 16px 28px; }
            .coming-soon-text { letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <!-- Canvas for 3D Dynamic Neural & Particle Network -->
    <div id="canvas-container">
        <canvas id="bgCanvas"></canvas>
    </div>

    <!-- Main Viewport Overlay -->
    <div class="viewport-wrapper">
        
        <!-- Rotating Ecosystem Orbit System -->
        <div class="orbit-ring orbit-1">
            <!-- Code / Tech -->
            <div class="eco-node" style="top: -19px; left: calc(50% - 19px);">
                <i class="fa-solid fa-code eco-icon"></i>
            </div>
            <!-- API -->
            <div class="eco-node" style="bottom: -19px; left: calc(50% - 19px);">
                <i class="fa-solid fa-network-wired eco-icon"></i>
            </div>
        </div>

        <div class="orbit-ring orbit-2">
            <!-- Problem Solving & Logic -->
            <div class="eco-node" style="top: 18%; left: 10%;">
                <i class="fa-solid fa-brain eco-icon"></i>
            </div>
            <!-- Science & Math -->
            <div class="eco-node" style="top: 18%; right: 10%;">
                <i class="fa-solid fa-atom eco-icon"></i>
            </div>
            <!-- Software Engineering -->
            <div class="eco-node" style="bottom: 18%; left: 10%;">
                <i class="fa-solid fa-laptop-code eco-icon"></i>
            </div>
            <!-- AI & Algorithms -->
            <div class="eco-node" style="bottom: 18%; right: 10%;">
                <i class="fa-solid fa-microchip eco-icon"></i>
            </div>
        </div>

        <div class="orbit-ring orbit-3">
            <!-- Video & Motion Creation -->
            <div class="eco-node" style="top: calc(50% - 19px); left: -19px;">
                <i class="fa-solid fa-film eco-icon"></i>
            </div>
            <!-- Creative Graphics Design -->
            <div class="eco-node" style="top: calc(50% - 19px); right: -19px;">
                <i class="fa-solid fa-wand-magic-sparkles eco-icon"></i>
            </div>
            <!-- Accounting & Finance Software -->
            <div class="eco-node" style="top: -19px; left: calc(50% - 19px);">
                <i class="fa-solid fa-chart-line eco-icon"></i>
            </div>
            <!-- Global Business Systems -->
            <div class="eco-node" style="bottom: -19px; left: calc(50% - 19px);">
                <i class="fa-solid fa-globe eco-icon"></i>
            </div>
        </div>

        <!-- Central Focal Point: ONLY COMING SOON -->
        <div class="content-core" id="triggerCore">
            <h1 class="coming-soon-text" id="mainText">COMING SOON</h1>
        </div>

    </div>

    <script>
        /* -------------------------------------------------------------
           1. CANVAS PARTICLE & NEURAL MESH SYSTEM (3D VISUALIZATION)
        ------------------------------------------------------------- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.size = Math.random() * 2 + 1;
                this.baseAlpha = Math.random() * 0.5 + 0.2;
                this.color = Math.random() > 0.4 ? '#d4af37' : (Math.random() > 0.5 ? '#00f3ff' : '#8a2be2');
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 2;
                        this.y -= (dy / distance) * force * 2;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.floor((width * height) / 11000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        initParticles();

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        let opacity = 1 - (distance / 120);
                        ctx.strokeStyle = `rgba(212, 175, 55, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.7;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            let bgGrad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, width);
            bgGrad.addColorStop(0, '#0a0a12');
            bgGrad.addColorStop(0.6, '#030305');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            connectParticles();
            requestAnimationFrame(animateCanvas);
        }

        animateCanvas();

        /* -------------------------------------------------------------
           2. GSAP LUXURY TEXT SHIMMER & REVEAL ANIMATIONS
        ------------------------------------------------------------- */
        gsap.from("#mainText", {
            duration: 2,
            scale: 0.9,
            opacity: 0,
            filter: "blur(12px)",
            ease: "power3.out"
        });

        gsap.to("#mainText", {
            duration: 3,
            textShadow: "0 0 20px rgba(212, 175, 55, 0.8), 0 0 40px rgba(0, 243, 255, 0.4)",
            repeat: -1,
            yoyo: true,
            ease: "sine.easeInOut"
        });

        /* -------------------------------------------------------------
           3. WEB AUDIO API (CINEMATIC SYNTH AMBIENCE ENGINE)
        ------------------------------------------------------------- */
        let audioCtx = null;

        function playAmbientSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(55, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 4);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 2);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 5);
        }

        window.addEventListener('click', () => {
            playAmbientSound();

            for (let i = 0; i < 12; i++) {
                let p = new Particle();
                p.x = mouse.x || width / 2;
                p.y = mouse.y || height / 2;
                p.vx = (Math.random() - 0.5) * 5;
                p.vy = (Math.random() - 0.5) * 5;
                p.size = Math.random() * 3 + 1.5;
                particles.push(p);
            }
        });
    </script>
</body>
</html>
