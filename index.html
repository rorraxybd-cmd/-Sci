<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY C-Tech Academy | Coming Soon</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Cinzel:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-pitch-black: #000000;
            --gold-glow: #ffd700;
            --cyan-glow: #00f3ff;
            --purple-glow: #bc13fe;
            --font-tech: 'Orbitron', sans-serif;
            --font-luxury: 'Cinzel', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pure Black Body Override */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important;
            background-color: #000000 !important;
            font-family: var(--font-tech);
            color: #ffffff;
        }

        /* 100% Solid Black Canvas Layer */
        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000000 !important;
            pointer-events: none;
        }

        /* Center Layout Wrapper */
        .stage-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Compact Refined Glass Card */
        .glass-pill-card {
            position: relative;
            z-index: 30;
            padding: clamp(12px, 2vw, 22px) clamp(25px, 5vw, 60px);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-top: 1.5px solid rgba(255, 215, 0, 0.7);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.6);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25),
                        inset 0 0 15px rgba(255, 215, 0, 0.15);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { border-color: rgba(0, 243, 255, 0.4); box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); }
            100% { border-color: rgba(255, 215, 0, 0.7); box-shadow: 0 0 45px rgba(255, 215, 0, 0.35); }
        }

        /* Letter Wave Text Container */
        .coming-soon-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(2px, 0.6vw, 8px);
        }

        .letter {
            font-size: clamp(1.4rem, 3.5vw, 2.8rem);
            font-weight: 900;
            letter-spacing: clamp(2px, 0.5vw, 6px);
            background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #00f3ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.7));
            animation: letterShimmer 3s ease-in-out infinite;
        }

        @keyframes letterShimmer {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 6px var(--cyan-glow)); }
            50% { transform: translateY(-5px) scale(1.12); filter: drop-shadow(0 0 16px var(--gold-glow)); }
        }

        .word-gap {
            width: clamp(10px, 2vw, 22px);
        }

        @media (max-width: 768px) {
            .glass-pill-card { padding: 10px 20px; border-radius: 25px; }
            .letter { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- Strict Solid Black Canvas -->
    <canvas id="networkCanvas"></canvas>

    <!-- Center Coming Soon Card -->
    <div class="stage-container">
        <div class="glass-pill-card">
            <div class="coming-soon-wrapper" id="textContainer">
                <!-- Generated dynamically by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        /* 1. Letter Stagger Generation Script */
        const phrase = "COMING SOON";
        const container = document.getElementById('textContainer');

        phrase.split('').forEach((char, index) => {
            if (char === " ") {
                const space = document.createElement('div');
                space.className = 'word-gap';
                container.appendChild(space);
            } else {
                const letter = document.createElement('span');
                letter.className = 'letter';
                letter.textContent = char;
                letter.style.animationDelay = `${index * 0.15}s`;
                container.appendChild(letter);
            }
        });

        /* 2. Constellation Network & Integrated Icon Logos Engine */
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        // FontAwesome Icons List to render directly on Network Nodes
        const iconUnicodeList = [
            '\uf121', // code (Software/Dev)
            '\uf5d2', // atom (AI/Science)
            '\uf5dc', // brain (Machine Learning)
            '\uf2db', // microchip (Hardware/Tech)
            '\uf008', // film (Video Editing)
            '\uf72b', // wand-magic-sparkles (VFX/Graphics)
            '\uf201', // chart-line (Accounting/Analytics)
            '\uf1ec', // calculator (Finance/Math)
            '\uf0ac', // globe (Networking)
            '\uf0c2'  // cloud (Cloud Tech)
        ];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(icon = null) {
                this.reset(icon);
            }

            reset(icon = null) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2.5 + 1.2;
                this.icon = icon;
                
                const colors = ['#ffd700', '#00f3ff', '#bc13fe', '#00ffaa'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.8 + 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;

                if (this.icon) {
                    // Draw Glowing Icon Logo directly on Node
                    ctx.font = '900 ' + Math.max(18, Math.min(width * 0.025, 28)) + 'px "Font Awesome 6 Free"';
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 15;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.icon, this.x, this.y);
                } else {
                    // Draw Standard Network Point
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initNetwork() {
            particles = [];
            // Create Special Icon Particles
            iconUnicodeList.forEach(icon => {
                particles.push(new Particle(icon));
            });

            // Create background constellation dots
            const count = Math.min(Math.floor((width * height) / 9000), 70);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initNetwork();

        function renderPitchBlackNetwork() {
            // FORCE STRICT SOLID BLACK CANVAS CLEAR (#000000)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Connect Points with Laser Synapse Lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = (1 - dist / 150) * 0.35;
                        ctx.lineWidth = 0.9;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(renderPitchBlackNetwork);
        }
        renderPitchBlackNetwork();

        /* 3. Automatic Ambient Sound Engine */
        let audioCtx = null;

        function startAutoSpaceSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                setInterval(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 3);

                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 1.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 4);
                }, 4000);
            } catch(e) {}
        }

        window.addEventListener('load', startAutoSpaceSound);
        window.addEventListener('touchstart', startAutoSpaceSound, { once: true });
        window.addEventListener('click', startAutoSpaceSound, { once: true });
    </script>
</body>
</html>
