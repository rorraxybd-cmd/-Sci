<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RORRAXY Sci-Tech Academy | Luxury Edition</title>

    <!-- Luxury Sci-Tech Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --pure-black: #020204;
            --gold-bright: #ffe600;
            --gold-main: #ffd700;
            --gold-dark: #b8860b;
            --gold-glow: rgba(255, 215, 0, 0.45);
            --font-luxury: 'Cinzel', serif;
            --font-tech: 'Orbitron', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--pure-black) !important;
            font-family: var(--font-luxury);
            color: #ffffff;
            touch-action: none;
        }

        /* Sci-Tech Canvas Layer */
        #quantumCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: var(--pure-black) !important;
            display: block;
        }

        /* Main Center Layout */
        .stage-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 20px;
        }

        /* Sci-Tech Luxury Subtitle */
        .brand-subtitle {
            font-family: var(--font-tech);
            font-size: clamp(0.75rem, 2vw, 1.25rem);
            font-weight: 800;
            letter-spacing: clamp(4px, 1.2vw, 10px);
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            text-transform: uppercase;
            animation: fadeInGlow 2s ease-out forwards;
        }

        .coming-soon-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1vw, 14px);
            pointer-events: auto;
        }

        /* Luxury 3D Golden Metallic Shimmering Typography */
        .letter {
            font-size: clamp(2.2rem, 6.8vw, 5.2rem);
            font-weight: 900;
            letter-spacing: clamp(2px, 0.8vw, 8px);
            background: linear-gradient(180deg, #ffffff 0%, #fff2ac 25%, #ffd700 60%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.8));
            animation: luxuryPulse 2.5s ease-in-out infinite alternate;
            will-change: transform, filter;
        }

        @keyframes luxuryPulse {
            0% { 
                transform: translateY(0) scale(1); 
                filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6)); 
            }
            100% { 
                transform: translateY(-8px) scale(1.05); 
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)); 
            }
        }

        @keyframes fadeInGlow {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .word-gap {
            width: clamp(14px, 3vw, 40px);
        }

        /* Subtle Luxury Sci-Tech Decorative Line */
        .tech-divider {
            width: clamp(120px, 25vw, 300px);
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
            margin-top: 25px;
            box-shadow: 0 0 12px var(--gold-main);
            animation: pulseLine 3s infinite ease-in-out;
        }

        @keyframes pulseLine {
            0%, 100% { opacity: 0.3; transform: scaleX(0.8); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        /* Mobile Optimization Rules */
        @media (max-width: 768px) {
            .letter {
                font-size: clamp(1.8rem, 8.5vw, 3rem);
            }
            .brand-subtitle {
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Sci-Tech Quantum Canvas Layer -->
    <canvas id="quantumCanvas"></canvas>

    <!-- Center Stage Container -->
    <div class="stage-container">
        <div class="brand-subtitle">RORRAXY SCI-TECH ACADEMY</div>
        <div class="coming-soon-wrapper" id="textContainer">
            <!-- Dynamically Rendered Letter By Letter -->
        </div>
        <div class="tech-divider"></div>
    </div>

    <script>
        /* 1. COMING SOON Letter Generator */
        const phrase = "COMING SOON";
        const container = document.getElementById('textContainer');

        phrase.split('').forEach((char, index) => {
            if (char === " ") {
                const space = document.createElement('div');
                space.className = 'word-gap';
                container.appendChild(space);
            } else {
                const letter = document.createElement('span');
                letter.className = 'letter';
                letter.textContent = char;
                letter.style.animationDelay = `${index * 0.1}s`;
                container.appendChild(letter);
            }
        });

        /* 2. Automatic Web Audio Synth Engine (No Interaction Needed) */
        let audioCtx = null;

        function startAutoSciTechAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Deep Sci-Tech Drone Sound
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low Deep Pitch

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 3);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
            } catch (e) {
                console.log("Audio autoplay restricted by browser policy.");
            }
        }

        // Auto trigger audio engine
        window.addEventListener('load', () => {
            startAutoSciTechAudio();
        });
        document.addEventListener('touchstart', startAutoSciTechAudio, { once: true });
        document.addEventListener('click', startAutoSciTechAudio, { once: true });

        /* 3. Luxury Quantum Sci-Tech Engine (Canvas) */
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height, dpr;
        let centerX, centerY;
        let isMobile = false;

        let stars = [];
        let rings = [];
        let particles = [];
        let globalTime = 0;

        function initCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            isMobile = width < 768;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpr, dpr);
            centerX = width / 2;
            centerY = height / 2;

            setupStars();
            setupQuantumRings();
            setupFloatingParticles();
        }

        function setupStars() {
            stars = [];
            const count = isMobile ? 50 : 130;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.015 + 0.005
                });
            }
        }

        function setupQuantumRings() {
            rings = [];
            const ringCount = isMobile ? 4 : 6;
            const baseRadius = Math.min(width, height) * (isMobile ? 0.28 : 0.22);

            for (let i = 0; i < ringCount; i++) {
                rings.push({
                    radius: baseRadius + (i * (isMobile ? 35 : 50)),
                    speed: (i % 2 === 0 ? 1 : -1) * (0.003 + i * 0.001),
                    angle: Math.random() * Math.PI * 2,
                    nodes: Math.floor(Math.random() * 4) + 3,
                    color: i % 2 === 0 ? '#ffd700' : '#ffe600'
                });
            }
        }

        function setupFloatingParticles() {
            particles = [];
            const count = isMobile ? 20 : 45;
            for (let i = 0; i < count; i++) {
                particles.push({
                    angle: Math.random() * Math.PI * 2,
                    distance: Math.random() * (Math.min(width, height) * 0.45),
                    speed: Math.random() * 0.008 + 0.002,
                    size: Math.random() * 2.5 + 1,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        /* Smooth Animation Loop */
        function renderSciTechSystem() {
            globalTime += 0.01;

            // Pitch Black Pure Background
            ctx.fillStyle = '#020204';
            ctx.fillRect(0, 0, width, height);

            // 1. Ambient Twinkling Quantum Stars
            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.alpha += s.speed;
                if (s.alpha > 0.95 || s.alpha < 0.15) s.speed *= -1;

                ctx.save();
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.globalAlpha = s.alpha;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }

            // 2. Sci-Tech Concentric Quantum Rings
            rings.forEach((ring) => {
                ring.angle += ring.speed;

                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, ring.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.12)';
                ctx.lineWidth = 1;
                ctx.setLineDash([8, 12]);
                ctx.stroke();
                ctx.restore();

                // Orbiting Glowing Nodes
                for (let i = 0; i < ring.nodes; i++) {
                    const nodeAngle = ring.angle + (Math.PI * 2 / ring.nodes) * i;
                    const x = centerX + Math.cos(nodeAngle) * ring.radius;
                    const y = centerY + Math.sin(nodeAngle) * ring.radius;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(x, y, isMobile ? 2.5 : 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = ring.color;
                    ctx.shadowColor = ring.color;
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // 3. Floating Golden Dust Particles
            particles.forEach((p) => {
                p.angle += p.speed;
                const x = centerX + Math.cos(p.angle) * p.distance;
                const y = centerY + Math.sin(p.angle) * p.distance;

                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.globalAlpha = p.alpha;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(renderSciTechSystem);
        }

        // Start animation frame
        requestAnimationFrame(renderSciTechSystem);
    </script>
</body>
</html>
